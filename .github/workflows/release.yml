name: Publish Release
on:
  release:
    types:
      - prereleased
      - released
jobs:
  publish-to-maven-central:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      # gradle/actions instead of burrunan/gradle-cache-action, which the organization's action
      # allow-list rejects.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace -Prelease=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          # NOTE: FML https://stackoverflow.com/a/39573795
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: FF618132
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
