name: Run PR Checks
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Lint
        uses: burrunan/gradle-cache-action@v2
        with:
          gradle-version: wrapper
          arguments: detekt
  unit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Unit Tests
        uses: burrunan/gradle-cache-action@v2
        with:
          gradle-version: wrapper
          arguments: test koverHtmlReport
