name: Run PR Checks
on: pull_request
# A new commit on the pull request replaces the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      # gradle/actions instead of burrunan/gradle-cache-action, which the organization's action
      # allow-list rejects: these checks failed at startup without running.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Lint
        run: ./gradlew detekt
  unit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Unit Tests
        run: ./gradlew test koverHtmlReport
